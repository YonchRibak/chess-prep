services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-prep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_prep
    ports:
      # Host port 5433, not 5432: other local projects run their own Postgres on
      # 5432. A collision is silent and confusing — the API connects to the other
      # database and fails with "password authentication failed for user chess".
      - "5433:5432"
    volumes:
      - chess_prep_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_prep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chess_prep_pgdata:
