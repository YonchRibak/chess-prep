services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-prep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_prep
    ports:
      - "5432:5432"
    volumes:
      - chess_prep_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_prep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chess_prep_pgdata:
